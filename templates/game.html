<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Play — Henry's Unblocked Games</title>
<link rel="stylesheet" href="/static/css/style.css">
<style>
.type-badge{font-family:var(--font-mono);font-size:10px;padding:2px 8px;border-radius:999px;border:1px solid var(--border);color:var(--muted);margin-left:8px;}
.type-badge.js{color:#f7df1e;border-color:#f7df1e;}.type-badge.zip{color:#a78bfa;border-color:#a78bfa;}.type-badge.html{color:var(--accent);border-color:var(--accent-dim);}
.zip-info{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:24px;text-align:center;aspect-ratio:16/10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
.frame-container{position:relative;}
.fs-overlay{position:absolute;top:10px;right:10px;z-index:10;}
</style>
</head><body>
<header class="site-header"><nav class="nav container">
  <a href="/" class="logo-henry"><span class="cursor"></span><span class="h-name">HENRY'S</span>&nbsp;UNBLOCKED GAMES</a>
  <div class="nav-links" id="nav-links"></div>
</nav></header>
<div class="container">
  <div class="section-title" id="game-title">Loading…</div>
  <div class="player-layout">
    <div class="player-frame-wrap">
      <div class="title-bar"><span id="game-meta">—</span><span id="game-actions" style="display:flex;gap:6px;align-items:center;"></span></div>
      <div class="frame-container" id="frame-container">
        <div class="fs-overlay">
          <button class="fullscreen-btn" id="fs-btn" title="Fullscreen">⛶ Fullscreen</button>
        </div>
        <div id="game-viewer"></div>
      </div>
    </div>
    <div class="chat-panel">
      <div class="chat-head"><span class="dot"></span> LIVE CHAT</div>
      <div class="chat-log" id="chat-log"></div>
      <div id="chat-status" class="hint" style="padding:0 12px;"></div>
      <form class="chat-input-row" id="chat-form">
        <input id="chat-input" placeholder="Say something…" maxlength="500" autocomplete="off">
        <button class="btn primary" type="submit">Send</button>
      </form>
    </div>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/static/js/app.js"></script>
<script>
renderHeader(null);
const params=new URLSearchParams(location.search);
const gameId=params.get('id');
const log=document.getElementById('chat-log');
let gameFrame = null;

function addLine(username,content,when,system){
  const line=el('div',{class:'chat-line'},[
    el('span',{class:system?'who system':'who',text:system?'*':username}),
    document.createTextNode(' '+content),
    el('span',{class:'when',text:when?timeAgo(when):''}),
  ]);
  log.appendChild(line);log.scrollTop=log.scrollHeight;
}

function renderViewer(game){
  const viewer=document.getElementById('game-viewer');
  const ft=game.file_type||'html';
  if(ft==='zip'){
    viewer.innerHTML=`<div class="zip-info">
      <div style="font-size:48px">📦</div>
      <h3 style="margin:0">${game.title}</h3>
      <p style="color:var(--muted)">Download the ZIP, extract it, then open index.html in your browser.</p>
      <a href="/uploads/games/${game.filename}" download class="btn primary" style="text-decoration:none">⬇ Download ZIP</a>
    </div>`;
    document.getElementById('fs-btn').style.display='none';
  } else if(ft==='js'){
    const html=`<!doctype html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;overflow:hidden}canvas,body{width:100%;height:100%;background:#000}</style></head><body><script src="/uploads/games/${game.filename}"><\/script></body></html>`;
    const blob=new Blob([html],{type:'text/html'});
    gameFrame=document.createElement('iframe');
    gameFrame.sandbox='allow-scripts allow-pointer-lock';
    gameFrame.src=URL.createObjectURL(blob);
    gameFrame.style.cssText='width:100%;aspect-ratio:16/10;border:none;display:block;background:#000;';
    viewer.appendChild(gameFrame);
  } else if(ft==='folder'){
    // filename is  folderid/relative/path/to/index.html
    gameFrame=document.createElement('iframe');
    gameFrame.sandbox='allow-scripts allow-pointer-lock allow-same-origin';
    gameFrame.src=`/uploads/games/${game.filename}`;
    gameFrame.style.cssText='width:100%;aspect-ratio:16/10;border:none;display:block;background:#000;';
    viewer.appendChild(gameFrame);
  } else {
    gameFrame=document.createElement('iframe');
    gameFrame.sandbox='allow-scripts allow-pointer-lock';
    gameFrame.src=`/uploads/games/${game.filename}`;
    gameFrame.style.cssText='width:100%;aspect-ratio:16/10;border:none;display:block;background:#000;';
    viewer.appendChild(gameFrame);
  }
}

// Fullscreen
document.getElementById('fs-btn').addEventListener('click', () => {
  const container = document.getElementById('frame-container');
  if(gameFrame){
    if(document.fullscreenElement){ document.exitFullscreen(); }
    else { gameFrame.requestFullscreen && gameFrame.requestFullscreen(); }
  }
});

async function loadGame(){
  try{
    const games=await api('/api/games');
    const game=games.find(g=>String(g.id)===gameId);
    if(!game){document.getElementById('game-title').textContent='Game not found';return;}
    document.title=`${game.title} — Henry's Unblocked Games`;
    const ft=game.file_type||'html';
    const titleEl=document.getElementById('game-title');
    titleEl.textContent=game.title;
    titleEl.appendChild(el('span',{class:`type-badge ${ft}`,text:ft.toUpperCase()}));
    document.getElementById('game-meta').textContent=`by ${game.uploader}`;
    renderViewer(game);
    const me=await getMe();
    if(me&&(me.role==='admin'||me.username===game.uploader)){
      const b=el('button',{class:'btn danger small',text:'Delete'});
      b.addEventListener('click',async()=>{if(!confirm('Delete?'))return;await api(`/api/games/${game.id}`,{method:'DELETE'});window.location.href='/';});
      document.getElementById('game-actions').appendChild(b);
    }
  }catch(e){document.getElementById('game-title').textContent='Error: '+e.message;}
}
loadGame();
const socket=io();
socket.on('connect_error',()=>document.getElementById('chat-status').textContent='Could not connect — are you logged in?');
socket.on('chat:error',m=>addLine('',''+m,null,true));
socket.on('chat:history',h=>{log.innerHTML='';h.forEach(m=>addLine(m.username,m.content,m.created_at));});
socket.on('chat:message',m=>addLine(m.username,m.content,m.created_at));
document.getElementById('chat-form').addEventListener('submit',e=>{
  e.preventDefault();const inp=document.getElementById('chat-input');const t=inp.value.trim();if(!t)return;
  socket.emit('chat:message',t);inp.value='';
});
</script>
</body></html>
